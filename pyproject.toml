[project]
name = "harborwise"
version = "1.0.0"
description = "HarborWise: berth-clearance prediction and arrival-speed optimisation (IBM Z Datathon)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 140
